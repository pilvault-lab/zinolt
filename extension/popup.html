<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Send to Zinolt</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>Send to Zinolt</h1>
    <p class="hint">
      Adds a <strong>→ Z</strong> button to every tweet on x.com. Click it to
      queue that tweet into the Zinolt sourcing table.
    </p>
    <form id="cfg">
      <label>
        <span>Shared secret</span>
        <input
          id="sharedSecret"
          name="sharedSecret"
          type="password"
          autocomplete="off"
          spellcheck="false"
          required
        />
      </label>
      <label>
        <span>Default page target</span>
        <select id="pageTarget" name="pageTarget">
          <option value="">(none)</option>
          <option value="general">General</option>
          <option value="fintech">Fintech</option>
        </select>
      </label>
      <button type="submit">Save</button>
      <p id="status" class="status" role="status"></p>
    </form>
    <script src="popup.js"></script>
  </body>
</html>
