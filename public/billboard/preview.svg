<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <rect width="1080" height="1920" fill="#1a1a2e"/>
  <!-- Sky gradient -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d3561"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1920" fill="url(#sky)"/>
  <!-- Ground/street -->
  <rect y="1400" width="1080" height="520" fill="#111"/>
  <!-- Building silhouette -->
  <rect x="80" y="200" width="920" height="1300" fill="#0d1117" rx="4"/>
  <!-- Billboard panel — perspective quad -->
  <polygon points="168,560 912,528 932,800 148,836" fill="rgba(240,237,228,0.97)"/>
  <!-- Text lines on panel -->
  <rect x="230" y="590" width="620" height="52" rx="6" fill="#141414" opacity="0.85"/>
  <rect x="280" y="658" width="520" height="52" rx="6" fill="#141414" opacity="0.85"/>
  <rect x="320" y="726" width="440" height="36" rx="5" fill="#141414" opacity="0.5"/>
  <!-- VERNAVLE label -->
  <rect x="440" y="784" width="200" height="14" rx="3" fill="#141414" opacity="0.3"/>
  <!-- Street lights -->
  <rect x="900" y="900" width="8" height="500" fill="#333"/>
  <rect x="860" y="896" width="56" height="6" rx="3" fill="#444"/>
</svg>
