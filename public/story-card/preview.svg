  <text x="92" y="930" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="72" font-weight="400" fill="white" opacity="0.95">about your feelings.</text>
  <text x="92" y="1060" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="72" font-weight="400" fill="white" opacity="0.95">The data always tells</text>
